<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6a00">
  <title>Appliance Parts Lookup</title>
  <style>
    :root{--orange:#ff6a00;--orange-dark:#df5600;--ink:#171717;--muted:#707070;--line:#dedede;--bg:#f3f3f3;--white:#fff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{height:62px;background:var(--ink);color:#fff;display:flex;align-items:center;padding:0 max(18px,calc((100vw - 760px)/2));font-size:15px;font-weight:850;letter-spacing:.02em}
    .hazard{height:8px;background:repeating-linear-gradient(135deg,var(--orange) 0 14px,#171717 14px 28px)}
    main{max-width:600px;margin:0 auto;padding:clamp(42px,12vh,100px) 20px 48px}
    .eyebrow{font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-dark)}
    h1{font-size:clamp(30px,8vw,44px);line-height:1.03;letter-spacing:-.045em;margin:9px 0 10px}
    .sub{color:var(--muted);margin:0 0 26px;font-size:15px}
    .panel{background:var(--white);border:1px solid var(--line);border-top:5px solid var(--orange);border-radius:14px;padding:22px;box-shadow:0 14px 35px rgba(0,0,0,.07)}
    .fields{display:grid;gap:15px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
    select,input{width:100%;min-height:52px;border:1px solid #cfcfcf;border-radius:9px;background:#fff;padding:12px 14px;color:var(--ink);font:inherit;outline:none}
    select:focus,input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,106,0,.17)}
    input{text-transform:uppercase}
    button{width:100%;min-height:54px;margin-top:20px;border:0;border-radius:9px;background:var(--orange);color:#171717;font:850 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
    button:hover{background:#ff7a1a}button:active{transform:translateY(1px)}
    .help{font-size:12px;color:var(--muted);margin:13px 2px 0}
    @media(max-width:480px){header{height:56px;padding:0 17px}.panel{padding:18px}.sub{font-size:14px}}
  </style>
</head>
<body>
  <header>HEDLUND APPLIANCE SERVICE</header>
  <div class="hazard" aria-hidden="true"></div>
  <main>
    <div class="eyebrow">Field parts lookup</div>
    <h1>Find the right part.</h1>
    <p class="sub">Choose the appliance and brand, then enter the model number.</p>
    <form class="panel" id="lookupForm">
      <div class="fields">
        <div class="field">
          <label for="appliance">Appliance type</label>
          <select id="appliance" required>
            <option value="" selected disabled>Select appliance</option>
            <option>Washer</option><option>Dryer</option><option>Oven / Range</option><option>Refrigerator</option><option>Dishwasher</option>
          </select>
        </div>
        <div class="field">
          <label for="brand">Brand</label>
          <select id="brand" required>
            <option value="" selected disabled>Select brand</option>
            <option>Amana</option><option>Bosch</option><option>Electrolux</option><option>Frigidaire</option><option>GE</option><option>Hotpoint</option><option>JennAir</option><option>KitchenAid</option><option>LG</option><option>Maytag</option><option>Miele</option><option>Samsung</option><option>Thermador</option><option>Whirlpool</option><option>Wolf</option><option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="model">Model number</label>
          <input id="model" type="text" placeholder="Enter exact model number" autocomplete="off" autocapitalize="characters" required>
        </div>
      </div>
      <button type="submit">Search Sears PartsDirect&nbsp; ↗</button>
      <p class="help">Opens Sears model results. Select the exact model to view its parts list.</p>
    </form>
  </main>
  <script>
    document.getElementById('lookupForm').addEventListener('submit', event => {
      event.preventDefault();
      const brand = document.getElementById('brand').value.trim();
      const model = document.getElementById('model').value.trim().toUpperCase();
      const query = [brand, model].filter(Boolean).join(' ');
      window.open(`https://www.searspartsdirect.com/search?q=${encodeURIComponent(query)}&tab=model`, '_blank');
    });
  </script>
</body>
</html>
